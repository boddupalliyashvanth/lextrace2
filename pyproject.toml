[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lextrace"
version = "0.1.0"
description = "Agentic legal assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "rapidfuzz>=3.5.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "typer>=0.12.0",
    "streamlit>=1.39.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "sentence-transformers>=3.2.0",
    "faiss-cpu>=1.9.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "tenacity>=9.0.0",
    "google-genai>=0.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]
